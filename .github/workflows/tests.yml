name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests/version.js compares with the PR's base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Version checks
        run: node tests/version.js ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - name: Exercise library links
        run: node tests/library.js
      - name: Starting weights and progression
        run: node tests/progression.js
      - name: Recipe nutrition audit
        run: python3 tools/nutrition_audit.py --check
      - name: Smoke test every page
        run: |
          python3 -m http.server 8765 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8765/ && break; sleep 0.5; done
          node tests/smoke.js

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
